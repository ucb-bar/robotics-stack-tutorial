# Bedrock API key for BACKEND=llm (ModelBlaster). Tracked: no secrets live here.
#
# The AWS ACCOUNT is not configured anywhere: it is whoever is logged in when
# scripts/93_bedrock_key.sh runs (`aws login`). The key belongs to that account, and so do the
# model access and the per-minute quotas every seat shares.
#
# Any value can be overridden by exporting it before running the script.

BEDROCK_REGION="${BEDROCK_REGION:-us-west-2}"
# On-demand model ID (deepseek.v3.2, moonshotai.kimi-k2.5, ...) or a cross-region inference
# profile ID (us.moonshotai.kimi-k3, ...). The policy renderer handles both.
BEDROCK_MODEL_ID="${BEDROCK_MODEL_ID:-deepseek.v3.2}"

BEDROCK_IAM_USER="${BEDROCK_IAM_USER:-iiswc-2026-bedrock}"
BEDROCK_POLICY_NAME="${BEDROCK_POLICY_NAME:-InvokeOneModelOnly}"
# Hard cutoff: the key stops working at this moment, to the second, even if nobody revokes it.
# It is a condition (DateLessThan aws:CurrentTime) on every statement of the key's policy -- i.e. it
# lives in AWS, not on the seats -- so it can be moved on a LIVE key without re-distributing:
#     scripts/93_bedrock_key.sh cutoff "2026-09-28 18:00"     # move it
#     scripts/93_bedrock_key.sh cutoff none                   # remove it
#     scripts/93_bedrock_key.sh cutoff                        # show it
# Write it as a plain wall-clock time in BEDROCK_TZ (daylight/standard time is worked out for you),
# or with an explicit offset / Z, which then wins. "" = no cutoff.
BEDROCK_VALID_UNTIL="${BEDROCK_VALID_UNTIL-2026-09-27 20:00}"
BEDROCK_TZ="${BEDROCK_TZ:-America/Los_Angeles}"
# The key's own expiry, in whole days (all the IAM API accepts). Empty = the smallest number of days
# that covers BEDROCK_VALID_UNTIL (a backstop behind the exact policy cutoff); 7 if there is no cutoff.
BEDROCK_KEY_AGE_DAYS="${BEDROCK_KEY_AGE_DAYS:-}"

# Written into every seat's env file.
BEDROCK_MAX_USD="${BEDROCK_MAX_USD:-2}"            # MODELBLASTER_MAX_USD, a client-side cap per process

# Tests: things the key must NOT be able to do.
BEDROCK_NEGATIVE_MODEL="${BEDROCK_NEGATIVE_MODEL:-qwen.qwen3-32b-v1:0}"
BEDROCK_NEGATIVE_REGION="${BEDROCK_NEGATIVE_REGION:-us-east-1}"

# Where the admin's master copy of the key lives (untracked, mode 600), and where it goes on a seat.
BEDROCK_SECRET_FILE="${BEDROCK_SECRET_FILE:-$IISWC_ROOT/secrets/bedrock.env}"
BEDROCK_SEAT_ENV_PATH="${BEDROCK_SEAT_ENV_PATH:-.config/iiswc/bedrock.env}"   # relative to the seat user's $HOME
